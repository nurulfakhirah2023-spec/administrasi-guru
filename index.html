<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Administrasi Guru Profesional - SMPN 1 Plampang</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel untuk JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 m-0 p-0 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [activeTab, setActiveTab] = React.useState('perangkat');
            const [selectedClass, setSelectedClass] = React.useState('VII-A');
            
            // State Data Siswa
            const [students, setStudents] = React.useState(() => {
                const saved = localStorage.getItem('smpn1_students');
                return saved ? JSON.parse(saved) : [
                    { id: 1, name: 'Ahmad Dahlan', nis: '1001', class: 'VII-A' },
                    { id: 2, name: 'Siti Nurhaliza', nis: '1002', class: 'VII-A' }
                ];
            });
            const [newStudentName, setNewStudentName] = React.useState('');
            const [newStudentNis, setNewStudentNis] = React.useState('');

            // State Modul Ajar / CP & TP
            const [modulList, setModulList] = React.useState([
                { id: 1, mapel: 'Informatika', bab: 'Berpikir Komputasional', tp: 'Memahami konsep dekomposisi dan pengenalan pola dalam pemecahan masalah.' }
            ]);
            const [newMapel, setNewMapel] = React.useState('');
            const [newBab, setNewBab] = React.useState('');
            const [newTp, setNewTp] = React.useState('');

            // State Alokasi Jumlah Soal Generator per TP (Default: Sesuai Kebutuhan)
            const [genConfig, setGenConfig] = React.useState({
                pg: 5,
                pgKompleks: 2,
                jodoh: 2,
                isian: 2,
                uraian: 1
            });

            // State Bank Soal
            const [questionList, setQuestionList] = React.useState([]);

            React.useEffect(() => {
                localStorage.setItem('smpn1_students', JSON.stringify(students));
            }, [students]);

            // Handler Siswa
            const handleAddStudent = (e) => {
                e.preventDefault();
                if (!newStudentName.trim() || !newStudentNis.trim()) return;
                setStudents([...students, { id: Date.now(), name: newStudentName, nis: newStudentNis, class: selectedClass }]);
                setNewStudentName('');
                setNewStudentNis('');
            };

            const handleDeleteStudent = (id) => {
                setStudents(students.filter(s => s.id !== id));
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const text = event.target.result;
                    const rows = text.split('\n');
                    const updatedStudents = [...students];
                    rows.forEach((row, idx) => {
                        if (idx === 0) return;
                        const cols = row.split(',');
                        if (cols.length >= 2 && cols[0].trim() && cols[1].trim()) {
                            updatedStudents.push({ id: Date.now() + idx, nis: cols[0].trim(), name: cols[1].trim(), class: selectedClass });
                        }
                    });
                    setStudents(updatedStudents);
                    alert('Data siswa berhasil diimpor!');
                };
                reader.readAsText(file);
            };

            // Handler Tambah TP
            const handleAddModul = (e) => {
                e.preventDefault();
                if (!newMapel.trim() || !newTp.trim()) return;
                setModulList([...modulList, { id: Date.now(), mapel: newMapel, bab: newBab || 'Materi Umum', tp: newTp }]);
                setNewMapel('');
                setNewBab('');
                setNewTp('');
            };

            // GENERATOR SOAL KUSTOM BERDASARKAN ALOKASI DAN TP
            const handleGenerateSoal = (modul) => {
                const newGenerated = [];
                let counter = 1;

                // PG (A-E)
                for (let i = 0; i < genConfig.pg; i++) {
                    newGenerated.push({
                        id: Date.now() + counter++,
                        type: 'Pilihan Ganda',
                        mapel: modul.mapel,
                        bab: modul.bab,
                        sourceTp: modul.tp,
                        text: `Berdasarkan pemahaman materi "${modul.bab}", manakah penerapan yang paling tepat dari TP: "${modul.tp.substring(0, 40)}..."?`,
                        options: { A: 'Penggunaan konsep dasar secara efektif', B: 'Penulisan dokumen manual tanpa verifikasi', C: 'Penyimpanan data fisik pada lemari', D: 'Pengabaian struktur data', E: 'Pencetakan ulang dokumen tanpa editing' },
                        key: 'A'
                    });
                }

                // PG Kompleks
                for (let i = 0; i < genConfig.pgKompleks; i++) {
                    newGenerated.push({
                        id: Date.now() + counter++,
                        type: 'PG Kompleks',
                        mapel: modul.mapel,
                        bab: modul.bab,
                        sourceTp: modul.tp,
                        text: `Pilihlah beberapa pernyataan yang mendukung ketercapaian TP pada bab "${modul.bab}"!`,
                        options: { A: 'Memahami konsep utama', B: 'Dapat mengaplikasikan perkakas terkait', C: 'Mengabaikan prosedur kerja', D: 'Mampu menganalisis masalah', E: 'Menghindari diskusi kelompok' },
                        key: 'A, B, D'
                    });
                }

                // Menjodohkan
                for (let i = 0; i < genConfig.jodoh; i++) {
                    newGenerated.push({
                        id: Date.now() + counter++,
                        type: 'Menjodohkan',
                        mapel: modul.mapel,
                        bab: modul.bab,
                        sourceTp: modul.tp,
                        text: `Jodohkanlah istilah pada Kolom Kiri dengan deskripsi pada Kolom Kanan yang sesuai dengan materi "${modul.bab}"!`,
                        options: null,
                        key: '-'
                    });
                }

                // Isian Singkat
                for (let i = 0; i < genConfig.isian; i++) {
                    newGenerated.push({
                        id: Date.now() + counter++,
                        type: 'Isian Singkat',
                        mapel: modul.mapel,
                        bab: modul.bab,
                        sourceTp: modul.tp,
                        text: `Istilah teknis utama yang digunakan dalam pencapaian TP "${modul.tp.substring(0, 30)}..." adalah ________.`,
                        options: null,
                        key: '-'
                    });
                }

                // Uraian
                for (let i = 0; i < genConfig.uraian; i++) {
                    newGenerated.push({
                        id: Date.now() + counter++,
                        type: 'Uraian / Essay',
                        mapel: modul.mapel,
                        bab: modul.bab,
                        sourceTp: modul.tp,
                        text: `Jelaskan langkah-langkah konkret dalam mengaplikasikan TP: "${modul.tp}"!`,
                        options: null,
                        key: '-'
                    });
                }

                const totalGenerated = newGenerated.length;
                setQuestionList([...questionList, ...newGenerated]);
                setActiveTab('kisi-kisi');
                alert(`Berhasil menghasilkan ${totalGenerated} soal otomatis (PG: ${genConfig.pg}, PG Kompleks: ${genConfig.pgKompleks}, Menjodohkan: ${genConfig.jodoh}, Isian: ${genConfig.isian}, Uraian: ${genConfig.uraian})!`);
            };

            // EKSPOR KISI-KISI & SOAL KE MS WORD (.DOCX)
            const exportToWord = () => {
                if (questionList.length === 0) {
                    alert('Belum ada soal untuk diekspor! Silakan generate soal terlebih dahulu.');
                    return;
                }

                const headerHtml = `
                    <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                    <head>
                        <meta charset='utf-8'>
                        <title>Kisi-Kisi dan Naskah Soal Asesmen</title>
                        <style>
                            body { font-family: 'Calibri', 'Arial', sans-serif; font-size: 11pt; line-height: 1.3; }
                            h2, h3 { text-align: center; margin: 3px; }
                            .header-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
                            .header-table td { padding: 4px; font-size: 10pt; }
                            table.grid { width: 100%; border-collapse: collapse; margin-top: 10px; margin-bottom: 20px; }
                            table.grid th, table.grid td { border: 1px solid #000; padding: 5px; font-size: 10pt; text-align: left; }
                            table.grid th { background-color: #f2f2f2; text-align: center; }
                            .soal-item { margin-bottom: 12px; }
                            .opsi-list { margin-left: 20px; }
                        </style>
                    </head>
                    <body>
                        <h2>PEMERINTAH KABUPATEN SUMBAWA</h2>
                        <h3>SMPN 1 PLAMPANG</h3>
                        <p style="text-align:center; font-size:10pt; margin-top:0;">Alamat: Jln. Lintas Sumbawa-Bima, Plampang, NTB</p>
                        <hr style="border: 1px solid black; margin-bottom: 15px;"/>
                        
                        <h3 style="text-decoration: underline;">KISI-KISI & NASKAH SOAL ASESMEN</h3>
                        
                        <table class="header-table">
                            <tr>
                                <td width="15%"><strong>Mata Pelajaran</strong></td>
                                <td width="35%">: ${questionList[0]?.mapel || 'Informatika'}</td>
                                <td width="15%"><strong>Guru Pengampu</strong></td>
                                <td width="35%">: Ardin Yusuf, S.Pd.</td>
                            </tr>
                            <tr>
                                <td><strong>Satuan Pendidikan</strong></td>
                                <td>: SMPN 1 Plampang</td>
                                <td><strong>Tahun Ajaran</strong></td>
                                <td>: 2026/2027</td>
                            </tr>
                        </table>

                        <h3>I. TABEL KISI-KISI ASESMEN</h3>
                        <table class="grid">
                            <thead>
                                <tr>
                                    <th width="5%">No</th>
                                    <th width="35%">Tujuan Pembelajaran (TP)</th>
                                    <th width="20%">Materi / Bab</th>
                                    <th width="20%">Bentuk Soal</th>
                                    <th width="10%">No. Soal</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${questionList.map((q, idx) => `
                                    <tr>
                                        <td style="text-align:center;">${idx + 1}</td>
                                        <td>${q.sourceTp}</td>
                                        <td>${q.bab}</td>
                                        <td>${q.type}</td>
                                        <td style="text-align:center;">${idx + 1}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>

                        <br/>
                        <h3>II. NASKAH BUTIR SOAL</h3>
                        <ol>
                            ${questionList.map((q) => `
                                <li class="soal-item">
                                    <strong>[${q.type}]</strong> ${q.text}
                                    ${q.options ? `
                                        <div class="opsi-list">
                                            A. ${q.options.A}<br/>
                                            B. ${q.options.B}<br/>
                                            C. ${q.options.C}<br/>
                                            D. ${q.options.D}<br/>
                                            E. ${q.options.E}
                                        </div>
                                        <p style="font-size:9pt; color:#444; margin-top:2px;"><em>Kunci Jawaban: ${q.key}</em></p>
                                    ` : ''}
                                </li>
                            `).join('')}
                        </ol>

                        <br/><br/>
                        <table width="100%" style="border:none;">
                            <tr>
                                <td width="60%"></td>
                                <td style="text-align:center;">
                                    Plampang, ${new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}<br/>
                                    Guru Mata Pelajaran,<br/><br/><br/><br/>
                                    <strong><u>Ardin Yusuf, S.Pd.</u></strong><br/>
                                    NIP. -
                                </td>
                            </tr>
                        </table>
                    </body>
                    </html>
                `;

                const blob = new Blob(['\ufeff' + headerHtml], { type: 'application/msword' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Kisi-Kisi_dan_Soal_SMPN1Plampang_${Date.now()}.doc`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };

            return (
                <div className="min-h-screen flex flex-col bg-slate-100 font-sans">
                    {/* Header Utama */}
                    <header className="bg-indigo-600 text-white shadow-md p-4 flex justify-between items-center">
                        <div>
                            <h1 className="text-xl font-bold tracking-wide">Aplikasi Administrasi Guru Profesional</h1>
                            <p className="text-xs text-indigo-200">SMPN 1 Plampang</p>
                        </div>
                        <div className="text-right">
                            <span className="bg-indigo-700 px-3 py-1 rounded-full text-xs font-semibold">Tahun Ajaran 2026/2027</span>
                        </div>
                    </header>

                    <div className="flex flex-1">
                        {/* Sidebar Navigasi */}
                        <aside className="w-64 bg-white border-r border-slate-200 p-4 flex flex-col gap-2">
                            <div className="pb-3 mb-2 border-b border-slate-100">
                                <p className="text-xs text-slate-400 uppercase font-semibold">Menu Utama</p>
                            </div>
                            <button onClick={() => setActiveTab('dashboard')} className={`text-left px-4 py-2.5 rounded-xl text-sm font-medium transition-all ${activeTab === 'dashboard' ? 'bg-indigo-50 text-indigo-700 font-semibold shadow-sm' : 'text-slate-600 hover:bg-slate-50'}`}>📌 Dashboard</button>
                            <button onClick={() => setActiveTab('perangkat')} className={`text-left px-4 py-2.5 rounded-xl text-sm font-medium transition-all ${activeTab === 'perangkat' ? 'bg-indigo-50 text-indigo-700 font-semibold shadow-sm' : 'text-slate-600 hover:bg-slate-50'}`}>📚 Perangkat Pembelajaran & TP</button>
                            <button onClick={() => setActiveTab('kisi-kisi')} className={`text-left px-4 py-2.5 rounded-xl text-sm font-medium transition-all ${activeTab === 'kisi-kisi' ? 'bg-indigo-50 text-indigo-700 font-semibold shadow-sm' : 'text-slate-600 hover:bg-slate-50'}`}>📝 Bank Soal & Kisi-Kisi</button>
                            <button onClick={() => setActiveTab('siswa')} className={`text-left px-4 py-2.5 rounded-xl text-sm font-medium transition-all ${activeTab === 'siswa' ? 'bg-indigo-50 text-indigo-700 font-semibold shadow-sm' : 'text-slate-600 hover:bg-slate-50'}`}>👥 Data Siswa & Kelas</button>
                        </aside>

                        {/* Area Konten Utama */}
                        <main className="flex-1 p-6">
                            {/* TAB DASHBOARD */}
                            {activeTab === 'dashboard' && (
                                <div className="space-y-6">
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                        <div className="flex justify-between items-start mb-4">
                                            <div>
                                                <h2 className="text-xl font-bold text-slate-800">Panel Utama Administrasi</h2>
                                                <p className="text-sm text-slate-500 mt-1">Selamat datang kembali, <strong className="text-indigo-600">Ardin Yusuf, S.Pd.</strong></p>
                                            </div>
                                            <span className="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-md font-medium">Status System: Aktif</span>
                                        </div>
                                        <p className="text-xs text-slate-600 leading-relaxed">
                                            Atur alokasi jumlah bentuk soal pada menu Perangkat Pembelajaran, klik <strong>Generate Soal Otomatis</strong>, lalu unduh dokumen Kisi-Kisi & Soal ke Microsoft Word (.docx).
                                        </p>
                                    </div>
                                </div>
                            )}

                            {/* TAB PERANGKAT PEMBELAJARAN */}
                            {activeTab === 'perangkat' && (
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6">
                                    <div>
                                        <h2 className="text-lg font-bold text-slate-800">Capaian Pembelajaran (CP) & Tujuan Pembelajaran (TP)</h2>
                                        <p className="text-xs text-slate-500">Guru Pengampu: <strong>Ardin Yusuf, S.Pd.</strong></p>
                                    </div>

                                    {/* FORM PENGATURAN ALOKASI BENTUK SOAL */}
                                    <div className="bg-indigo-50/80 p-4 rounded-xl border border-indigo-100 space-y-3">
                                        <h4 className="text-xs font-bold text-indigo-900 uppercase tracking-wide">⚙️ Pengaturan Alokasi Bentuk Soal (Saat Generate Otomatis)</h4>
                                        <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
                                            <div>
                                                <label className="block text-[11px] font-semibold text-indigo-800 mb-1">Pilihan Ganda (A-E)</label>
                                                <input type="number" min="0" value={genConfig.pg} onChange={(e) => setGenConfig({...genConfig, pg: parseInt(e.target.value) || 0})} className="w-full border border-indigo-200 rounded-lg p-1.5 text-xs text-center font-bold bg-white" />
                                            </div>
                                            <div>
                                                <label className="block text-[11px] font-semibold text-indigo-800 mb-1">PG Kompleks</label>
                                                <input type="number" min="0" value={genConfig.pgKompleks} onChange={(e) => setGenConfig({...genConfig, pgKompleks: parseInt(e.target.value) || 0})} className="w-full border border-indigo-200 rounded-lg p-1.5 text-xs text-center font-bold bg-white" />
                                            </div>
                                            <div>
                                                <label className="block text-[11px] font-semibold text-indigo-800 mb-1">Menjodohkan</label>
                                                <input type="number" min="0" value={genConfig.jodoh} onChange={(e) => setGenConfig({...genConfig, jodoh: parseInt(e.target.value) || 0})} className="w-full border border-indigo-200 rounded-lg p-1.5 text-xs text-center font-bold bg-white" />
                                            </div>
                                            <div>
                                                <label className="block text-[11px] font-semibold text-indigo-800 mb-1">Isian Singkat</label>
                                                <input type="number" min="0" value={genConfig.isian} onChange={(e) => setGenConfig({...genConfig, isian: parseInt(e.target.value) || 0})} className="w-full border border-indigo-200 rounded-lg p-1.5 text-xs text-center font-bold bg-white" />
                                            </div>
                                            <div>
                                                <label className="block text-[11px] font-semibold text-indigo-800 mb-1">Uraian / Essay</label>
                                                <input type="number" min="0" value={genConfig.uraian} onChange={(e) => setGenConfig({...genConfig, uraian: parseInt(e.target.value) || 0})} className="w-full border border-indigo-200 rounded-lg p-1.5 text-xs text-center font-bold bg-white" />
                                            </div>
                                        </div>
                                    </div>

                                    {/* Form Tambah TP */}
                                    <form onSubmit={handleAddModul} className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                                        <h4 className="text-xs font-bold text-slate-700">Tambah Tujuan Pembelajaran (TP) Baru</h4>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                            <input type="text" placeholder="Mata Pelajaran (misal: IPA / Informatika)" value={newMapel} onChange={(e) => setNewMapel(e.target.value)} className="border border-slate-300 rounded-lg px-3 py-2 text-xs bg-white" />
                                            <input type="text" placeholder="Topik / Bab Pembelajaran" value={newBab} onChange={(e) => setNewBab(e.target.value)} className="border border-slate-300 rounded-lg px-3 py-2 text-xs bg-white" />
                                        </div>
                                        <textarea placeholder="Tuliskan kalimat Tujuan Pembelajaran (TP) di sini..." value={newTp} onChange={(e) => setNewTp(e.target.value)} className="w-full border border-slate-300 rounded-lg p-2.5 text-xs bg-white h-16" />
                                        <button type="submit" className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-xs font-medium">+ Simpan TP</button>
                                    </form>

                                    {/* Daftar TP dengan Tombol Generator Soal Otomatis */}
                                    <div className="space-y-3 pt-2">
                                        <h4 className="text-xs font-bold text-slate-700">Daftar TP Tersimpan & Action Generator:</h4>
                                        {modulList.map(m => (
                                            <div key={m.id} className="p-4 border border-slate-200 rounded-xl bg-slate-50 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                                                <div>
                                                    <span className="bg-indigo-100 text-indigo-700 text-[10px] font-bold px-2 py-0.5 rounded-md">{m.mapel} - {m.bab}</span>
                                                    <p className="text-xs font-semibold text-slate-800 mt-1">TP: {m.tp}</p>
                                                </div>
                                                <div className="flex gap-2 w-full md:w-auto justify-end">
                                                    <button onClick={() => handleGenerateSoal(m)} className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-2 rounded-lg font-medium shadow-sm transition flex items-center gap-1">
                                                        ✨ Generate Soal Otomatis
                                                    </button>
                                                    <button onClick={() => setModulList(modulList.filter(item => item.id !== m.id))} className="text-rose-600 hover:text-rose-800 text-xs px-2 py-1">Hapus</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* TAB KISI-KISI & EKSPOR WORD */}
                            {activeTab === 'kisi-kisi' && (
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                                    <div className="border-b pb-3 flex flex-col md:flex-row justify-between items-start md:items-center gap-2">
                                        <div>
                                            <h2 className="text-lg font-bold text-slate-800">Bank Soal & Matriks Kisi-Kisi Asesmen</h2>
                                            <p className="text-xs text-slate-500">Penyusun: <strong>Ardin Yusuf, S.Pd.</strong> | Total Soal: {questionList.length}</p>
                                        </div>
                                        <button 
                                            onClick={exportToWord}
                                            className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md transition flex items-center gap-2"
                                        >
                                            📄 Ekspor Kisi-Kisi & Soal ke Word (.docx)
                                        </button>
                                    </div>

                                    {/* Matriks Tabel Kisi-Kisi */}
                                    <div className="overflow-x-auto pt-2">
                                        <h4 className="text-xs font-bold text-slate-700 mb-2">Tabel Matriks Kisi-Kisi Asesmen:</h4>
                                        <table className="w-full text-xs text-left border border-slate-200">
                                            <thead className="bg-slate-100 text-slate-700 uppercase text-[10px]">
                                                <tr>
                                                    <th className="p-2 border">No</th>
                                                    <th className="p-2 border">Tujuan Pembelajaran (TP)</th>
                                                    <th className="p-2 border">Bentuk Soal</th>
                                                    <th className="p-2 border">Kunci Jawaban</th>
                                                    <th className="p-2 border">Aksi</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {questionList.length === 0 ? (
                                                    <tr>
                                                        <td colSpan="5" className="p-4 text-center text-slate-400">Belum ada soal dihasilkan. Silakan jalankan generator dari tab Perangkat Pembelajaran.</td>
                                                    </tr>
                                                ) : (
                                                    questionList.map((q, idx) => (
                                                        <tr key={q.id} className="hover:bg-slate-50 border-b">
                                                            <td className="p-2 border text-center font-bold">{idx + 1}</td>
                                                            <td className="p-2 border">{q.sourceTp}</td>
                                                            <td className="p-2 border font-semibold text-indigo-600">{q.type}</td>
                                                            <td className="p-2 border text-emerald-600 font-bold">{q.key}</td>
                                                            <td className="p-2 border text-center">
                                                                <button onClick={() => setQuestionList(questionList.filter(item => item.id !== q.id))} className="text-rose-600 hover:underline">Hapus</button>
                                                            </td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {/* TAB DATA SISWA */}
                            {activeTab === 'siswa' && (
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                                    <div className="flex justify-between items-center border-b pb-4">
                                        <h2 className="text-lg font-bold text-slate-800">Manajemen Data Siswa</h2>
                                        <select value={selectedClass} onChange={(e) => setSelectedClass(e.target.value)} className="border border-slate-300 rounded-lg px-3 py-1.5 text-xs font-medium bg-slate-50">
                                            <option value="VII-A">Kelas VII-A</option>
                                            <option value="VII-B">Kelas VII-B</option>
                                            <option value="VIII-A">Kelas VIII-A</option>
                                            <option value="IX-A">Kelas IX-A</option>
                                        </select>
                                    </div>

                                    <div className="bg-indigo-50/50 p-4 rounded-xl border border-indigo-100 flex justify-between items-center">
                                        <div>
                                            <h4 className="text-xs font-bold text-indigo-900">Impor Data Siswa (Format CSV / Excel)</h4>
                                            <p className="text-[11px] text-indigo-700/80">Format .csv: <code>NIS, Nama Lengkap Siswa</code></p>
                                        </div>
                                        <label className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-xs font-medium cursor-pointer">
                                            📁 Unggah File Excel/CSV
                                            <input type="file" accept=".csv" onChange={handleFileUpload} className="hidden" />
                                        </label>
                                    </div>

                                    <form onSubmit={handleAddStudent} className="flex gap-2">
                                        <input type="text" placeholder="NIS Siswa" value={newStudentNis} onChange={(e) => setNewStudentNis(e.target.value)} className="border border-slate-300 rounded-lg px-3 py-2 text-xs w-32" />
                                        <input type="text" placeholder="Nama Lengkap Siswa" value={newStudentName} onChange={(e) => setNewStudentName(e.target.value)} className="border border-slate-300 rounded-lg px-3 py-2 text-xs flex-1" />
                                        <button type="submit" className="bg-indigo-600 text-white font-medium px-4 py-2 rounded-lg text-xs">+ Tambah Manual</button>
                                    </form>

                                    <div className="pt-3 border-t border-slate-200 max-h-60 overflow-y-auto space-y-2">
                                        {students.filter(s => s.class === selectedClass).map(s => (
                                            <div key={s.id} className="flex justify-between items-center text-xs bg-slate-50 p-3 rounded-xl border border-slate-200">
                                                <span><strong className="text-indigo-600">{s.nis}</strong> - {s.name}</span>
                                                <button onClick={() => handleDeleteStudent(s.id)} className="text-rose-600 font-medium">Hapus</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
