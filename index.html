<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Administrasi Guru Profesional - SMPN 1 Plampang</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel untuk JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 m-0 p-0 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [selectedClass, setSelectedClass] = React.useState('VII-A');
            
            // State Data Siswa
            const [students, setStudents] = React.useState(() => {
                const saved = localStorage.getItem('smpn1_students');
                return saved ? JSON.parse(saved) : [
                    { id: 1, name: 'Ahmad Dahlan', nis: '1001', class: 'VII-A' },
                    { id: 2, name: 'Siti Nurhaliza', nis: '1002', class: 'VII-A' }
                ];
            });

            const [newStudentName, setNewStudentName] = React.useState('');
            const [newStudentNis, setNewStudentNis] = React.useState('');

            // State Bank Soal & Kisi-kisi
            const [questionType, setQuestionType] = React.useState('Pilihan Ganda');
            const [questionList, setQuestionList] = React.useState([
                { id: 1, type: 'Pilihan Ganda', text: 'Contoh soal pilihan ganda pertama...', options: ['A', 'B', 'C', 'D'], key: 'A' }
            ]);
            const [newQuestionText, setNewQuestionText] = React.useState('');

            React.useEffect(() => {
                localStorage.setItem('smpn1_students', JSON.stringify(students));
            }, [students]);

            // Tambah Siswa Manual
            const handleAddStudent = (e) => {
                e.preventDefault();
                if (!newStudentName.trim() || !newStudentNis.trim()) return;
                const newStudent = {
                    id: Date.now(),
                    name: newStudentName,
                    nis: newStudentNis,
                    class: selectedClass
                };
                setStudents([...students, newStudent]);
                setNewStudentName('');
                setNewStudentNis('');
            };

            // Hapus Siswa
            const handleDeleteStudent = (id) => {
                setStudents(students.filter(s => s.id !== id));
            };

            // Fitur Impor Siswa dari File CSV/Excel (.csv)
            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const text = event.target.result;
                    const rows = text.split('\n');
                    const newStudentsList = [...students];
                    
                    rows.forEach((row, index) => {
                        if (index === 0) return; // Lewati baris header
                        const cols = row.split(',');
                        if (cols.length >= 2) {
                            const nis = cols[0].trim();
                            const name = cols[1].trim();
                            if (nis && name) {
                                newStudentsList.push({
                                    id: Date.now() + index,
                                    nis: nis,
                                    name: name,
                                    class: selectedClass
                                });
                            }
                        }
                    });
                    setStudents(newStudentsList);
                    alert('Data siswa berhasil diimpor!');
                };
                reader.readAsText(file);
            };

            // Tambah Soal
            const handleAddQuestion = (e) => {
                e.preventDefault();
                if (!newQuestionText.trim()) return;
                setQuestionList([...questionList, { id: Date.now(), type: questionType, text: newQuestionText }]);
                setNewQuestionText('');
            };

            return (
                <div className="min-h-screen flex flex-col bg-slate-100">
                    {/* Header Utama */}
                    <header className="bg-indigo-600 text-white shadow-md p-4 flex justify-between items-center">
                        <div>
                            <h1 className="text-xl font-bold tracking-wide">Aplikasi Administrasi Guru Profesional</h1>
                            <p className="text-xs text-indigo-200">SMPN 1 Plampang</p>
                        </div>
                        <div className="text-right">
                            <span className="bg-indigo-700 px-3 py-1 rounded-full text-xs font-semibold">Tahun Ajaran 2026/2027</span>
                        </div>
                    </header>

                    <div className="flex flex-1">
                        {/* Sidebar Navigasi */}
                        <aside className="w-64 bg-white border-r border-slate-200 p-4 flex flex-col gap-2">
                            <div className="pb-3 mb-2 border-b border-slate-100">
                                <p className="text-xs text-slate-400 uppercase font-semibold">Menu Utama</p>
                            </div>
                            <button 
                                onClick={() => setActiveTab('dashboard')}
                                className={`text-left px-4 py-2.5 rounded-xl text-sm font-medium transition-all ${activeTab === 'dashboard' ? 'bg-indigo-50 text-indigo-700 font-semibold shadow-sm' : 'text-slate-600 hover:bg-slate-50'}`}
                            >
                                📌 Dashboard
                            </button>
                            <button 
                                onClick={() => setActiveTab('perangkat')}
                                className={`text-left px-4 py-2.5 rounded-xl text-sm font-medium transition-all ${activeTab === 'perangkat' ? 'bg-indigo-50 text-indigo-700 font-semibold shadow-sm' : 'text-slate-600 hover:bg-slate-50'}`}
                            >
                                📚 Perangkat Pembelajaran
                            </button>
                            <button 
                                onClick={() => setActiveTab('kisi-kisi')}
                                className={`text-left px-4 py-2.5 rounded-xl text-sm font-medium transition-all ${activeTab === 'kisi-kisi' ? 'bg-indigo-50 text-indigo-700 font-semibold shadow-sm' : 'text-slate-600 hover:bg-slate-50'}`}
                            >
                                📝 Bank Soal & Kisi-Kisi
                            </button>
                            <button 
                                onClick={() => setActiveTab('siswa')}
                                className={`text-left px-4 py-2.5 rounded-xl text-sm font-medium transition-all ${activeTab === 'siswa' ? 'bg-indigo-50 text-indigo-700 font-semibold shadow-sm' : 'text-slate-600 hover:bg-slate-50'}`}
                            >
                                👥 Data Siswa & Kelas
                            </button>
                        </aside>

                        {/* Area Konten Utama */}
                        <main className="flex-1 p-6">
                            {/* TAB DASHBOARD */}
                            {activeTab === 'dashboard' && (
                                <div className="space-y-6">
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                        <div className="flex justify-between items-start mb-4">
                                            <div>
                                                <h2 className="text-xl font-bold text-slate-800">Panel Utama Administrasi</h2>
                                                <p className="text-sm text-slate-500 mt-1">Selamat datang kembali, <strong className="text-indigo-600">Ardin Yusuf, S.Pd.</strong></p>
                                            </div>
                                            <span className="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-md font-medium">Status System: Aktif</span>
                                        </div>
                                        <p className="text-xs text-slate-600 leading-relaxed">
                                            Seluruh modul administrasi pembelajaran, kisi-kisi asesmen, dan data siswa SMPN 1 Plampang siap diakses dan dikelola melalui menu interaktif.
                                        </p>

                                        {/* Grid Kartu Interaktif */}
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
                                            <div onClick={() => setActiveTab('perangkat')} className="p-5 bg-indigo-50 hover:bg-indigo-100/80 border border-indigo-100 rounded-2xl cursor-pointer transition shadow-xs group">
                                                <h3 className="font-semibold text-indigo-900">Perangkat Pembelajaran</h3>
                                                <p className="text-xs text-indigo-700/80 mt-1">Kelola administrasi guru mapel, modul ajar, dan CP/TP.</p>
                                                <span className="inline-block mt-3 text-xs font-semibold text-indigo-600">Buka Modul &rarr;</span>
                                            </div>

                                            <div onClick={() => setActiveTab('kisi-kisi')} className="p-5 bg-emerald-50 hover:bg-emerald-100/80 border border-emerald-100 rounded-2xl cursor-pointer transition shadow-xs group">
                                                <h3 className="font-semibold text-emerald-900">Bank Soal & Kisi-Kisi</h3>
                                                <p className="text-xs text-emerald-700/80 mt-1">Buat, susun kisi-kisi, dan kelola bank soal asesmen.</p>
                                                <span className="inline-block mt-3 text-xs font-semibold text-emerald-600">Buka Modul &rarr;</span>
                                            </div>

                                            <div onClick={() => setActiveTab('siswa')} className="p-5 bg-amber-50 hover:bg-amber-100/80 border border-amber-100 rounded-2xl cursor-pointer transition shadow-xs group">
                                                <h3 className="font-semibold text-amber-900">Data Siswa & Kelas</h3>
                                                <p className="text-xs text-amber-700/80 mt-1">Manajemen daftar siswa dan impor data via file Excel/CSV.</p>
                                                <span className="inline-block mt-3 text-xs font-semibold text-amber-600">Buka Modul &rarr;</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* TAB PERANGKAT */}
                            {activeTab === 'perangkat' && (
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                                    <h2 className="text-lg font-bold text-slate-800">Perangkat Pembelajaran Guru</h2>
                                    <p className="text-xs text-slate-600">Pengelola Perangkat Kurikulum Merdeka untuk <strong>Ardin Yusuf, S.Pd.</strong></p>
                                    <div className="p-4 border border-slate-200 rounded-xl bg-slate-50">
                                        <h4 className="font-semibold text-sm text-slate-800">Modul Ajar & Bahan Ajar</h4>
                                        <p className="text-xs text-slate-500 mt-1">Dokumen perangkat siap diunduh dan disesuaikan.</p>
                                    </div>
                                </div>
                            )}

                            {/* TAB KISI-KISI & BANK SOAL (DIAKTIFKAN) */}
                            {activeTab === 'kisi-kisi' && (
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                                    <div className="flex justify-between items-center border-b pb-4">
                                        <div>
                                            <h2 className="text-lg font-bold text-slate-800">Modul Bank Soal & Kisi-Kisi Asesmen</h2>
                                            <p className="text-xs text-slate-500">Penyusun: Ardin Yusuf, S.Pd.</p>
                                        </div>
                                    </div>

                                    {/* Form Tambah Soal */}
                                    <form onSubmit={handleAddQuestion} className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                                        <div className="flex gap-2">
                                            <select 
                                                value={questionType} 
                                                onChange={(e) => setQuestionType(e.target.value)}
                                                className="border border-slate-300 rounded-lg px-3 py-2 text-xs font-medium"
                                            >
                                                <option value="Pilihan Ganda">Pilihan Ganda</option>
                                                <option value="PG Kompleks">PG Kompleks</option>
                                                <option value="Menjodohkan">Menjodohkan</option>
                                                <option value="Isian Singkat">Isian Singkat</option>
                                                <option value="Uraian / Essay">Uraian / Essay</option>
                                            </select>
                                            <input 
                                                type="text"
                                                placeholder="Tuliskan bunyi pertanyaan / soal..."
                                                value={newQuestionText}
                                                onChange={(e) => setNewQuestionText(e.target.value)}
                                                className="border border-slate-300 rounded-lg px-3 py-2 text-xs flex-1"
                                            />
                                            <button type="submit" className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-xs font-medium">
                                                + Tambah Soal
                                            </button>
                                        </div>
                                    </form>

                                    {/* Daftar Soal */}
                                    <div className="space-y-2 max-h-72 overflow-y-auto">
                                        {questionList.map((q, idx) => (
                                            <div key={q.id} className="p-3 bg-white border border-slate-200 rounded-xl text-xs flex justify-between items-center">
                                                <div>
                                                    <span className="font-bold text-indigo-600 mr-2">[{q.type}]</span>
                                                    <span>{idx + 1}. {q.text}</span>
                                                </div>
                                                <button onClick={() => setQuestionList(questionList.filter(item => item.id !== q.id))} className="text-rose-600 hover:text-rose-800 font-medium">Hapus</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* TAB DATA SISWA & IMPORT EXCEL */}
                            {activeTab === 'siswa' && (
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                                    <div className="flex justify-between items-center border-b pb-4">
                                        <div>
                                            <h2 className="text-lg font-bold text-slate-800">Manajemen Data Siswa</h2>
                                            <p className="text-xs text-slate-500">SMPN 1 Plampang</p>
                                        </div>
                                        <select 
                                            value={selectedClass} 
                                            onChange={(e) => setSelectedClass(e.target.value)}
                                            className="border border-slate-300 rounded-lg px-3 py-1.5 text-xs font-medium bg-slate-50"
                                        >
                                            <option value="VII-A">Kelas VII-A</option>
                                            <option value="VII-B">Kelas VII-B</option>
                                            <option value="VIII-A">Kelas VIII-A</option>
                                            <option value="IX-A">Kelas IX-A</option>
                                        </select>
                                    </div>

                                    {/* Bagian Upload File Excel/CSV */}
                                    <div className="bg-indigo-50/50 p-4 rounded-xl border border-indigo-100 flex justify-between items-center">
                                        <div>
                                            <h4 className="text-xs font-bold text-indigo-900">Impor Data Siswa (Format CSV / Excel)</h4>
                                            <p className="text-[11px] text-indigo-700/80 mt-0.5">Unggah file berformat `.csv` dengan kolom: <code>NIS, Nama Lengkap</code></p>
                                        </div>
                                        <label className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-xs font-medium cursor-pointer shadow-sm transition">
                                            📁 Unggah File Excel/CSV
                                            <input type="file" accept=".csv" onChange={handleFileUpload} className="hidden" />
                                        </label>
                                    </div>

                                    {/* Form Tambah Siswa Manual */}
                                    <form onSubmit={handleAddStudent} className="flex gap-2">
                                        <input 
                                            type="text"
                                            placeholder="NIS Siswa"
                                            value={newStudentNis}
                                            onChange={(e) => setNewStudentNis(e.target.value)}
                                            className="border border-slate-300 rounded-lg px-3 py-2 text-xs w-32"
                                        />
                                        <input 
                                            type="text"
                                            placeholder="Nama Lengkap Siswa"
                                            value={newStudentName}
                                            onChange={(e) => setNewStudentName(e.target.value)}
                                            className="border border-slate-300 rounded-lg px-3 py-2 text-xs flex-1"
                                        />
                                        <button type="submit" className="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg text-xs transition">
                                            + Tambah Manual
                                        </button>
                                    </form>

                                    {/* Daftar Siswa */}
                                    <div className="pt-3 border-t border-slate-200 max-h-60 overflow-y-auto space-y-2">
                                        {students.filter(s => s.class === selectedClass).length === 0 ? (
                                            <p className="text-xs text-slate-400 text-center py-4">Belum ada data siswa untuk kelas ini.</p>
                                        ) : (
                                            students.filter(s => s.class === selectedClass).map(s => (
                                                <div key={s.id} className="flex justify-between items-center text-xs bg-slate-50 p-3 rounded-xl border border-slate-200">
                                                    <span><strong className="text-indigo-600 font-semibold">{s.nis}</strong> - {s.name}</span>
                                                    <button onClick={() => handleDeleteStudent(s.id)} className="text-rose-600 hover:text-rose-800 font-medium px-2 py-1 rounded-md hover:bg-rose-50">
                                                        Hapus
                                                    </button>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
