<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Administrasi Guru Profesional - SMPN 1 Plampang</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel untuk JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-900 m-0 p-0">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-100">
                    <div className="bg-white p-8 rounded-2xl shadow-md max-w-lg w-full text-center">
                        <h1 className="text-2xl font-bold text-indigo-600 mb-2">Aplikasi Administrasi Guru Profesional</h1>
                        <p className="text-slate-600 mb-4">SMPN 1 Plampang</p>
                        <div className="p-4 bg-indigo-50 rounded-xl text-indigo-700 text-sm">
                            Sistem administrasi dan perangkat pembelajaran guru siap digunakan.
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
